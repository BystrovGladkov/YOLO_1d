# training parameters
min_lr: 0.000100000000            # initial learning rate
max_lr: 0.010000000000            # maximum learning rate
momentum: 0.9370000000            # SGD momentum/Adam beta1
weight_decay: 0.000500            # optimizer weight decay
warmup_epochs: 3.00000            # warmup epochs
# loss components weights
weight_box: 7.500000000000000            # box loss gain
weight_cls: 0.500000000000000            # cls loss gain
weight_dfl: 1.100000000000000            # dfl loss gain
# augmentation parameters
mosaic: 1.000000000000            # image mosaic (probability)
adversal: 0.3                   # probability to use adversal augmentations
# classes
names:
  - flashbutt
  - alumothermic
  - rail_end
  - axle_counter
  - crossing
  - manual_arc
# signal properties
regular_size: 50000   # 
input_size: 49152   
