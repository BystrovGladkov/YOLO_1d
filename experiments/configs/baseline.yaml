# Baseline E2 (без аугментаций). Отличия от ludb_baseline_A: backbone_strides B, nms_iou 0.2, early_stopping_epochs 40, seeds [0, 1].
name: baseline
description: 'Baseline MyNet-1d (E2): nano, страйды B {8,16,32}, nms_iou 0.2, lr 0.01,
  batch 32, 150 эпох, early stopping 40, без аугментаций; 5 фолдов x 2 сида. Выбор
  — docs/results/E2_baseline.md.'
dataset: data/splits/fold_{fold}.yaml
manifest: data/processed/ludb/manifest.csv
folds:
- 0
- 1
- 2
- 3
- 4
seeds:
- 0
- 1
training:
  names:
  - P
  - QRS
  - T
  model_size: nano
  input_channels: 1
  backbone_strides: B
  bias_init: 1d
  expected_objects: 24
  epochs: 150
  batch_size: 32
  num_workers: 0
  early_stopping_epochs: 40
  max_lr: 0.01
  min_lr: 0.0001
  warmup_epochs: 3
  ema_decay: 0.999
  ema_tau: 200
  delineation_metrics: true
  delineation_conf: 0.25
  best_metric: F1_mean6
  nms_iou: 0.2
  augmentations:
    regular_length: 5000
    input_length: 5120
    validation_resize: false
    square_noises: 0
    random_resize: 0
    phase_spectrum_noise: 0
    random_jitter: 0
    random_invert: 0
    random_reverse: 0
    channel_scaling: 0
    time_masking: 0
    channel_masking: 0
    mosaic: 0
    mix_up: 0
    adversarial: 0
