name: abl_full_minus_A
description: 'Full без группы A (амплитуда: A1, A2, A3)'
dataset: data/splits/fold_{fold}.yaml
manifest: data/processed/ludb/manifest.csv
folds:
- 0
- 1
- 2
- 3
- 4
seeds:
- 0
training:
  names:
  - P
  - QRS
  - T
  model_size: nano
  input_channels: 1
  backbone_strides: B
  bias_init: 1d
  expected_objects: 24
  epochs: 150
  batch_size: 32
  num_workers: 4
  early_stopping_epochs: 40
  max_lr: 0.01
  min_lr: 0.0001
  warmup_epochs: 3
  ema_decay: 0.999
  ema_tau: 200
  delineation_metrics: true
  delineation_conf: 0.25
  best_metric: F1_mean6
  nms_iou: 0.2
  augmentations:
    regular_length: 5000
    input_length: 5120
    validation_resize: false
    square_noises: 0
    random_resize: 0
    phase_spectrum_noise: 0
    random_jitter: 0
    random_invert: 0
    random_reverse: 0
    channel_scaling: 0
    time_masking: 0
    channel_masking: 0
    mosaic: 0
    mix_up: 0
    adversarial: 0
    pipeline: ecg
    ecg:
      wander_p: 0.5
      powerline_p: 0.3
      emg_p: 0.3
      white_p: 0.3
      nstdb_p: 0.3
      step_p: 0.2
      filter_p: 0.3
      time_scale_p: 0.5
      hrv_warp_p: 0.5
      window_warp_p: 0.3
      time_mask_p: 0.2
      mosaic_p: 0.2
      splice_p: 0.3
ablation:
  augmentations:
  - M1
  - N1
  - N2
  - N3
  - N4
  - N5
  - N6
  - N7
  - T1
  - T2
  - T3
  - X1
  - X2
